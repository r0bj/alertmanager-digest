# Example configuration for alertmanager-digest.
#
# Required:
# - at least one Alertmanager in alertmanagers
# - slackWebhookUrl here or SLACK_WEBHOOK_URL in the environment

title: "Daily Alertmanager digest"

# Prefer SLACK_WEBHOOK_URL for secrets in production.
# slackWebhookUrl: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"

alertmanagers:
- name: prod
  url: https://alertmanager.example.com

# Optional label filters passed to Alertmanager API and applied to historical
# alerts decoded from Cloud Logging. Supported historical matcher operators:
# =, !=, =~, !~.
# filters:
# - severity=~"warning|critical"

# Labels shown next to each alert. Defaults to:
# severity, alertname, cluster, namespace.
# Use ["*"] to show all labels.
displayLabels:
- severity
- alertname
- cluster
- namespace
- team
# Labels hidden from Slack output after displayLabels is applied.
# excludeLabels:
# - prometheus
# - prometheus_namespace

slack:
  # Send a Slack message even when there are no active alerts.
  sendEmptyMessage: true
  # Defaults to 40.
  maxAlerts: 40

# Optional Cloud Logging lookup for alerts sent by alertmanager-webhook-logger.
# Uses Application Default Credentials with logging.read scope.
history:
  enabled: true
  # Defaults to 24h. Can be overridden with --history-window.
  window: 24h
  # Defaults to GOOGLE_CLOUD_PROJECT or GCLOUD_PROJECT when omitted.
  projectIds:
  - myproject
  # Defaults to alertmanager-webhook-logger container logs with message "Events received".
  # filter: 'resource.type="k8s_container" AND resource.labels.container_name="alertmanager-webhook-logger" AND jsonPayload.message="Events received"'
  # Defaults to slack.maxAlerts.
  maxAlerts: 40
  # Defaults to 1000.
  pageSize: 1000

# Optional HTTP settings.
# timeout is a backward-compatible default for all stage-specific timeouts below.
# timeout: 10s
# timeouts:
#   alertmanager: 10s
#   history: 30s
#   slack: 10s
# http:
#   insecureSkipVerify: false
