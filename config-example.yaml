# Example configuration for alertmanager-digest.

# Default: "Alertmanager daily digest".
title: "Daily Alertmanager digest"

# Default: false.
# When true, prints the Slack payload JSON instead of sending it.
dryRun: false

# Required unless dryRun=true or SLACK_WEBHOOK_URL env var is set.
# Prefer SLACK_WEBHOOK_URL for secrets in production.
slackWebhookUrl: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"

# Stage-specific timeouts.
# Defaults: alertmanager=10s, history=30s, slack=10s.
timeouts:
  alertmanager: 10s
  history: 30s
  slack: 10s

# Required: at least one Alertmanager.
alertmanagers:
- name: prod
  url: https://alertmanager.example.com

# Optional label filters.
# Passed to Alertmanager API and applied to historical alerts decoded from
# Cloud Logging. Historical matcher operators: =, !=, =~, !~.
# Default: [].
filters:
- severity=~"warning|critical"

# Labels used to group historical alerts and shown next to each alert.
# Default when omitted or empty: group by all labels and show all labels
# except alertname, which is shown as the title.
groupBy:
- severity
- cluster
- namespace
- team

# Labels hidden from Slack output after groupBy is applied.
# Cannot include labels explicitly listed in groupBy. When groupBy is omitted
# or empty, excludeLabels can hide labels from the all-label output.
# Default: [].
excludeLabels:
- prometheus
- prometheus_namespace

slack:
  # Send a Slack message even when there are no active or historical alerts.
  # Default: false.
  sendEmptyMessage: false
  # Maximum active alerts shown in Slack.
  # Default: 40.
  maxAlerts: 40

# Cloud Logging lookup for alerts sent by alertmanager-webhook-logger.
history:
  # Default: false.
  enabled: false
  # Historical lookup window.
  # Default: 24h. Can be overridden with --history-window.
  window: 24h
  # Google Cloud project IDs queried via Cloud Logging entries.list.
  # Default: GOOGLE_CLOUD_PROJECT or GCLOUD_PROJECT env var when omitted.
  # Required when history.enabled=true and neither env var is set.
  projectIds:
  - myproject
  # Cloud Logging filter used before the time-window clause is added.
  # Default:
  # resource.type="k8s_container" AND resource.labels.container_name="alertmanager-webhook-logger" AND jsonPayload.message="Events received"
  filter: 'resource.type="k8s_container" AND resource.labels.container_name="alertmanager-webhook-logger" AND jsonPayload.message="Events received"'
  # Maximum historical alert groups shown in Slack.
  # Default: slack.maxAlerts.
  maxAlerts: 40
  # Cloud Logging entries.list page size.
  # Default: 1000.
  pageSize: 1000

http:
  # Disable TLS certificate verification for Alertmanager/Slack/GCP requests.
  # Default: false.
  insecureSkipVerify: false
